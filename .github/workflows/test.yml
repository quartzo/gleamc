name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: sudo apt-get update && sudo apt-get install -y mold libuv1-dev libutf8proc-dev libicu-dev clang
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
